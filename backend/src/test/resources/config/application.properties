# Testy: bez automatycznego pobierania faktur z KSeF (testowe certyfikaty nie moga trafic do produkcyjnego KSeF).
# Plik w config/ uzupelnia glowny application.properties zamiast go zastepowac.
app.ksef.sync-enabled=false
app.ksef.base-url=http://localhost:1/ksef-disabled-in-tests
# KSeF jest w testach zamockowany - limity sprawdza osobny test KsefRateLimiterTests.
app.ksef.rate-limit-enabled=false
# Kopie zapasowe w testach tylko na zadanie (zrzut i Dysk Google sa zamockowane).
app.backup.schedule-enabled=false
# Zdjecia kont w testach zostaja w bazie: backend/.env ma dane R2 produkcji, a testy nie moga pisac do bucketu.
app.storage.r2.endpoint=
