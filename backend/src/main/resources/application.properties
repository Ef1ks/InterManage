spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/intermanage}
spring.datasource.username=${DB_USERNAME:intermanage}
spring.datasource.password=${DB_PASSWORD:intermanage}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Logowanie: JWT w ciasteczku HttpOnly AUTH_TOKEN.
# JWT_SECRET (min. 32 znaki) ustaw na produkcji; bez niego klucz jest losowany przy starcie
# i kazdy restart backendu wylogowuje wszystkich. AUTH_COOKIE_SECURE=true przy HTTPS.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.token-ttl=${AUTH_TOKEN_TTL:8h}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Link aktywacyjny dla nowego pracownika (na razie trafia do logow zamiast na maila).
app.auth.activation-ttl=${ACTIVATION_LINK_TTL:72h}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Konto wlasciciela tworzone przy pierwszym uruchomieniu, gdy w bazie nie ma zadnego wlasciciela.
# Domyslnie admin / admin. Pusty OWNER_PASSWORD wygeneruje losowe haslo wypisane raz w logach.
app.bootstrap.owner-username=${OWNER_USERNAME:admin}
app.bootstrap.owner-password=${OWNER_PASSWORD:admin}
