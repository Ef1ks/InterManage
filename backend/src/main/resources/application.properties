spring.application.name=backend
# Lokalne sekrety (JWT_SECRET itp.) z backend/.env - plik jest w .gitignore. Zmienne srodowiskowe maja pierwszenstwo.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/intermanage}
spring.datasource.username=${DB_USERNAME:intermanage}
spring.datasource.password=${DB_PASSWORD:intermanage}

spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

spring.jpa.hibernate.ddl-auto=validate
# Import produktow zapisuje dziesiatki tysiecy encji - Hibernate wysyla je paczkami.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Kolekcje (np. dzialy -> kategorie -> produkty formularza) doczytywane paczkami zamiast zapytaniem na element.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Import raportu produktow z Excela (ok. 11 MB przy 72 tys. pozycji).
spring.servlet.multipart.max-file-size=${IMPORT_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${IMPORT_MAX_FILE_SIZE:50MB}

# Logowanie: JWT w ciasteczku HttpOnly AUTH_TOKEN.
# JWT_SECRET (min. 32 znaki) ustaw na produkcji; bez niego klucz jest losowany przy starcie
# i kazdy restart backendu wylogowuje wszystkich. AUTH_COOKIE_SECURE=true przy HTTPS.
app.auth.jwt-secret=${JWT_SECRET:}
# Bez "nie wylogowuj mnie" token wygasa po AUTH_TOKEN_TTL przerwy (ciasteczko sesyjne), z nim po
# AUTH_REMEMBER_ME_TTL. Aktywnemu uzytkownikowi token odnawia sie co AUTH_TOKEN_REFRESH_AFTER.
app.auth.token-ttl=${AUTH_TOKEN_TTL:8h}
app.auth.remember-me-ttl=${AUTH_REMEMBER_ME_TTL:30d}
app.auth.token-refresh-after=${AUTH_TOKEN_REFRESH_AFTER:15m}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Link aktywacyjny dla nowego pracownika (wysylany mailem).
app.auth.activation-ttl=${ACTIVATION_LINK_TTL:72h}

# Maile przez SMTP (produkcja: relay Brevo smtp-relay.brevo.com:587, login i klucz SMTP z panelu Brevo).
# Pusty MAIL_HOST = maile wypisywane w logach backendu ([MAIL]) zamiast wysylane.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Nadawca musi byc w domenie zweryfikowanej w Brevo. Odpowiedzi odbiorcow ida na MAIL_REPLY_TO (puste = do nadawcy).
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@intermanage.pl}
app.mail.from-name=${MAIL_FROM_NAME:Intermanage}
app.mail.reply-to=${MAIL_REPLY_TO:}
# Kolejka maili: co ile sprawdzac zalegle i odstepy kolejnych prob po bledzie (po ostatniej mail jest porzucany).
app.mail.retry-interval=PT1M
app.mail.retry-delays=PT1M,PT5M,PT15M,PT1H,PT3H,PT6H
app.frontend-url=${FRONTEND_URL:https://intermanage.lvh.me:5173}

# Konto wlasciciela tworzone przy pierwszym uruchomieniu, gdy w bazie nie ma zadnego wlasciciela.
# Domyslnie admin / admin. Pusty OWNER_PASSWORD wygeneruje losowe haslo wypisane raz w logach.
app.bootstrap.owner-username=${OWNER_USERNAME:admin}
app.bootstrap.owner-password=${OWNER_PASSWORD:admin}

# Klucz do szyfrowania sekretow w bazie (haslo do klucza KSeF): 32 bajty w Base64, np. `openssl rand -base64 32`.
# Musi byc staly - po zmianie zapisane hasla trzeba wgrac ponownie.
app.secret-key=${APP_SECRET_KEY:}

# KSeF 2.0 (faktury zakupowe). Produkcja: https://api.ksef.mf.gov.pl/v2, test: https://api-test.ksef.mf.gov.pl/v2.
app.ksef.base-url=${KSEF_BASE_URL:https://api.ksef.mf.gov.pl/v2}
# Od kiedy pobierac faktury przy pierwszym polaczeniu sklepu (KSeF obowiazkowy od lutego 2026).
app.ksef.sync-from=${KSEF_SYNC_FROM:2026-02-01}
# Automatyczne pobieranie co ile (KSeF pozwala na 20 zapytan o faktury na godzine).
app.ksef.sync-enabled=${KSEF_SYNC_ENABLED:true}
app.ksef.sync-interval=${KSEF_SYNC_INTERVAL:PT30M}
# Pobieranie XML korekt w tle (faktury korygowane), w tych samych granicach co pobieranie faktur (sync-enabled).
app.ksef.corrections-interval=${KSEF_CORRECTIONS_INTERVAL:PT10M}
# Wlasne limity zapytan ponizej limitow KSeF (KsefRateLimiter): przekroczenia KSeF karze coraz dluzszymi blokadami.
app.ksef.rate-limit-enabled=true

# Propozycje AI we Wprowadzaniu danych (Gemini, REST generateContent). Pusty GEMINI_API_KEY = propozycje tylko
# z kartoteki sklepu. 429 i 503 ponawiane z odstepem, lacznie najwyzej retry-budget czekania.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.gemini.thinking-level=low
app.ai.gemini.read-timeout=PT60S
app.ai.gemini.retry-budget=PT30S
# Odczyt skanow WZ w Zakupie miesa: model mocniejszy niz lite (lite bral znaczki przy ilosciach za poprawki odreczne
# i dopisywal poprawki cen, ktorych nie bylo).
app.ai.gemini.scan-model=${GEMINI_SCAN_MODEL:gemini-3.5-flash}
app.ai.gemini.scan-read-timeout=PT120S

# Dane firmy po NIP-ie z GUS (BIR 1.1, wyszukiwarkaregon.stat.gov.pl). Pusty GUS_API_KEY = przycisk "Pobierz z GUS"
# zwraca blad. Klucz testowy GUS dziala tylko z adresem testowym (wyszukiwarkaregontest.stat.gov.pl).
app.gus.url=${GUS_API_URL:https://wyszukiwarkaregon.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc}
app.gus.api-key=${GUS_API_KEY:}
app.gus.timeout=PT20S

# Pliki w Cloudflare R2 (API zgodne z S3): zdjecia profilowe i tla kont. R2_S3_API = adres z nazwa bucketu
# (https://<konto>.r2.cloudflarestorage.com/<bucket>), R2_PUBLIC_URL = domena publicznego bucketu (cdn.intermanage.pl).
# Puste = zdjecia zostaja w bazie i serwuje je backend.
app.storage.r2.endpoint=${R2_S3_API:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.public-url=${R2_PUBLIC_URL:}

# Kopia zapasowa bazy na Dysk Google (Ustawienia -> Kopia zapasowa, tylko wlasciciel). Klient OAuth "aplikacja
# internetowa" z Google Cloud Console (Drive API), adres przekierowania <FRONTEND_URL>/api/settings/backup/google/callback.
# Puste = polaczenie z Google niedostepne. pg_dump musi byc nie starszy niz serwer bazy (produkcja: PostgreSQL 18).
app.backup.google.client-id=${GOOGLE_CLIENT_ID:}
app.backup.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Harmonogram kopii tylko na produkcji (deploy/docker-compose.yml): lokalny backend z bazą produkcyjną w .env
# robiłby kopie bez pg_dump i gpg, a przy starcie oznaczał kopię produkcji „w trakcie” jako przerwaną.
app.backup.schedule-enabled=${BACKUP_SCHEDULE_ENABLED:false}
app.backup.check-interval=PT5M
app.backup.work-dir=${BACKUP_WORK_DIR:${java.io.tmpdir}}
app.backup.pg-dump=${BACKUP_PG_DUMP:pg_dump}
app.backup.gpg=${BACKUP_GPG:gpg}
