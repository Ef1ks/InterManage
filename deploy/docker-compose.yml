# Produkcja (https://intermanage.pl). Na serwerze w /opt/intermanage obok pliku .env (wzór: .env.example).
# Workflow .github/workflows/deploy.yml kopiuje ten plik przy każdym wdrożeniu i podaje IMAGE_TAG = sha commita.
name: intermanage

services:
  # PostgreSQL stoi w osobnym LXC (192.168.33.110), adres i dane logowania są w .env.
  backend:
    image: ghcr.io/ef1ks/intermanage-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?ustaw DB_URL w .env}
      DB_USERNAME: ${DB_USERNAME:?ustaw DB_USERNAME w .env}
      DB_PASSWORD: ${DB_PASSWORD:?ustaw DB_PASSWORD w .env}
      JWT_SECRET: ${JWT_SECRET:?ustaw JWT_SECRET w .env}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?ustaw APP_SECRET_KEY w .env}
      OWNER_USERNAME: ${OWNER_USERNAME:-admin}
      # Puste = losowe hasło wypisane raz w logach backendu przy pierwszym starcie.
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      # Maile przez SMTP Brevo; pusty MAIL_HOST = maile tylko w logach backendu.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@intermanage.pl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Intermanage}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      FRONTEND_URL: https://intermanage.pl
      AUTH_COOKIE_SECURE: "true"
      # nginx podaje X-Forwarded-Proto, więc Spring wie, że żądanie przyszło po HTTPS.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      TZ: Europe/Warsaw

  web:
    image: ghcr.io/ef1ks/intermanage-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  # Cloudflare Tunnel: wychodzące połączenie do Cloudflare, bez otwierania portów na routerze.
  # W panelu Cloudflare (Zero Trust → Networks → Tunnels) hostname intermanage.pl → http://web:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?ustaw TUNNEL_TOKEN w .env}
    depends_on:
      - web
