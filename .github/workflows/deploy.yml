# Każdy push na main albo beta: testy → obrazy do ghcr.io → wdrożenie na serwer (LXC 192.168.33.113, przez subnet router Tailscale).
# main = produkcja (https://intermanage.pl, /opt/intermanage), beta = https://beta.intermanage.pl (/opt/intermanage-beta).
# Sekrety repozytorium: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY. Opis: deploy/README.md.
name: Deploy

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# Wdrożenia po kolei w obrębie gałęzi; nowszy commit nie przerywa trwającego wdrożenia, a beta nie czeka na produkcję.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers korzysta z Dockera dostępnego na runnerze.
      - run: mvn -B verify
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/ef1ks/intermanage-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/ef1ks/intermanage-${{ matrix.app }}:${{ github.ref_name == 'main' && 'latest' || 'beta' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    # Ręczne uruchomienie z innej gałęzi tylko testuje i buduje obrazy, nic nie wdraża.
    if: github.ref_name == 'main' || github.ref_name == 'beta'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Serwer jest osiągalny przez subnet router na hoście Proxmox (pve, 192.168.33.0/24).
          args: --accept-routes

      - name: Klucz SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Świeżo dołączony runner bywa przez chwilę bez połączenia z pve (25.11.2026: trzy próby z rzędu po 5 s),
          # więc na serwer czekamy do ok. 2,5 min zamiast jednej próby.
          for attempt in $(seq 1 12); do
            if ssh-keyscan -T 10 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            echo "Próba $attempt: serwer nie odpowiada na SSH przez Tailscale"
            sleep 3
          done
          tailscale status || true
          tailscale ping --c 3 pve || true
          echo "::error::Serwer nie odpowiada na SSH przez Tailscale (host pve, trasa 192.168.33.0/24)"
          exit 1

      - name: Wdrożenie
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_DIR: ${{ github.ref_name == 'main' && '/opt/intermanage' || '/opt/intermanage-beta' }}
          COMPOSE_SOURCE: ${{ github.ref_name == 'main' && 'deploy/docker-compose.yml' || 'deploy/docker-compose.beta.yml' }}
        run: |
          scp -i ~/.ssh/id_deploy "$COMPOSE_SOURCE" "$TARGET:$DEPLOY_DIR/docker-compose.yml"
          # GITHUB_TOKEN wygasa po zakończeniu joba, więc logujemy się do GHCR przy każdym wdrożeniu.
          ssh -i ~/.ssh/id_deploy "$TARGET" "
            set -e
            cd $DEPLOY_DIR
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            # Każde wdrożenie ma obraz z nowym tagiem; bez -a stare wersje zostawały i zapełniły dysk (224 obrazy).
            # -a usuwa tylko obrazy nieużywane przez kontenery, więc działająca wersja zostaje do czasu podmiany.
            docker image prune -af
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -af
          "
