# Ruch z internetu przychodzi tylko przez Cloudflare Tunnel (cloudflared w tej samej sieci Dockera, porty nie są
# wystawione), więc prawdziwy adres klienta jest w CF-Connecting-IP. Backend bierze go z X-Forwarded-For
# (limity zapytań per adres); nagłówka od klienta nie doklejamy, żeby nie dało się podać cudzego adresu.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Raport produktów dużego sklepu (200 tys. artykułów) ma ok. 35 MB, backend przyjmuje do 100 MB.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        # Przed nginx stoi Cloudflare Tunnel, a z przeglądarką rozmawia zawsze po HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Długie połączenia: wiadomości na żywo dla przeglądarek (SSE) i czekanie agenta sklepu na pliki (long polling).
    # Bez buforowania, żeby każda wiadomość szła od razu; backend pinguje strumień co 20 s, a czekanie trwa 25 s.
    location ~ ^/api/(stores/[^/]+/live|store-agent/file-queue/wait)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering no always;
    }

    # Pliki z hashem w nazwie nie zmieniają się nigdy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Nagłówki bezpieczeństwa strony (API ma własne ze Spring Security). Bez pełnego CSP, bo index.html ma
        # skrypt motywu w treści; zakaz osadzania w ramkach i reszta nie zależą od skryptów.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Ścieżki SPA (/dokumenty/pl, /faktury-ksef...) obsługuje react-router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # Nagłówki bezpieczeństwa strony (API ma własne ze Spring Security). Bez pełnego CSP, bo index.html ma
        # skrypt motywu w treści; zakaz osadzania w ramkach i reszta nie zależą od skryptów.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
