server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Raport produktów ma ok. 11 MB, backend przyjmuje do 50 MB.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Przed nginx stoi Cloudflare Tunnel, a z przeglądarką rozmawia zawsze po HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Pliki z hashem w nazwie nie zmieniają się nigdy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ścieżki SPA (/dokumenty/pl, /faktury-ksef...) obsługuje react-router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
