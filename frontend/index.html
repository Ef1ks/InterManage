<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Intermanage</title>
    <!-- Motyw przed pierwszym malowaniem (klucz jak THEME_STORAGE_KEY w lib/theme.ts), żeby ciemny nie mignął jasnym. -->
    <script>
      try {
        var t = localStorage.getItem('intermanage.theme')
        var d = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(d ? 'dark' : 'light')
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
