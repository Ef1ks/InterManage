services:
  postgres:
    image: postgres:17
    container_name: intermanage-postgres
    environment:
      POSTGRES_DB: intermanage
      POSTGRES_USER: intermanage
      POSTGRES_PASSWORD: intermanage
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
